# Amazon EC2
# price_query は AWS Price List API のフィルタ。2026-09-05 に ap-northeast-1 で
# 実データと突き合わせ済み（docs/reviews/price-query-review.md）。
service: ec2
display: Amazon EC2
icon: https://icons.terrastruct.com/aws%2FCompute%2FAmazon-EC2.svg
doc: EC2 インスタンス。アタッチする EBS もこのサービスの params で表す。
params:
  instanceType:
    type: string
    required: true
    doc: "インスタンスタイプ（例: t3.medium）"
  count:
    type: int
    default: 1
    doc: 台数
  ebsGb:
    type: float
    default: 0
    doc: 1 台あたりの EBS (gp3) 容量 GB
drivers:
  - id: instance_hours
    unit: Hrs
    doc: オンデマンドの Linux・共有テナンシーのみを対象とする
    price_query:
      serviceCode: AmazonEC2
      productFamily: Compute Instance
      instanceType: "{{instanceType}}"
      tenancy: Shared
      operatingSystem: Linux
      preInstalledSw: NA
      capacitystatus: Used
    quantity_formula: count * hoursPerDay * daysPerMonth
  - id: ebs_gb_month
    unit: GB-Mo
    doc: gp3 のプロビジョニング済み容量。IOPS とスループットの追加分は未計上
    price_query:
      serviceCode: AmazonEC2
      productFamily: Storage
      volumeApiName: gp3
    quantity_formula: count * ebsGb
