# Amazon S3
service: s3
display: Amazon S3
icon: https://icons.terrastruct.com/aws%2FStorage%2FAmazon-Simple-Storage-Service-S3.svg
doc: S3 バケット。ストレージ量とリクエスト数で課金される。
params:
  storageGb:
    type: float
    required: true
    doc: 保存データ量 GB
  storageClass:
    type: string
    default: Standard
    enum: [Standard, Standard - Infrequent Access, One Zone - Infrequent Access, Glacier Instant Retrieval]
    doc: ストレージクラス。値は Price List API の volumeType に渡す
  getRequestsPerMonth:
    type: float
    default: 0
    doc: 月間 GET リクエスト数
  putRequestsPerMonth:
    type: float
    default: 0
    doc: 月間 PUT / COPY / POST / LIST リクエスト数
drivers:
  - id: storage_gb_month
    unit: GB-Mo
    doc: 単価は最初の階層（〜50TB/月）のもの。それ以降の階層は未計上
    price_query:
      serviceCode: AmazonS3
      productFamily: Storage
      volumeType: "{{storageClass}}"
    quantity_formula: storageGb
  - id: put_requests
    unit: Requests
    price_query:
      serviceCode: AmazonS3
      productFamily: API Request
      group: S3-API-Tier1
      groupDescription: PUT/COPY/POST or LIST requests
    quantity_formula: putRequestsPerMonth
  - id: get_requests
    unit: Requests
    price_query:
      serviceCode: AmazonS3
      productFamily: API Request
      group: S3-API-Tier2
      groupDescription: GET and all other requests
    quantity_formula: getRequestsPerMonth
